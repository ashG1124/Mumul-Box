spring:
  profiles:
    active: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mumulbox?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: //로컬 mysql패스워드

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:mumulbox-very-long-secret-key-for-development-only-min-256-bits-required}
  expiration: ${JWT_EXPIRATION:86400000}  # 24시간 (밀리초)

app:
  share-base-url: ${SHARE_BASE_URL:http://localhost:3000/q}