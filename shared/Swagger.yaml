openapi: 3.0.1
info:
  title: 익명 질문 웹사이트 API 명세서
  description: Mumul Box 프로젝트의 REST API 문서입니다.
  version: v1.0.0
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- Bearer Auth: []
paths:
  /api/v1/samples:
    post:
      tags:
      - sample-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SampleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: integer
                format: int64
  /api/v1/samples/{id}:
    get:
      tags:
      - sample-controller
      operationId: getOne
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SampleResponse"
components:
  schemas:
    SampleRequest:
      required:
      - content
      - title
      type: object
      properties:
        title:
          type: string
        content:
          type: string
    SampleResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
  securitySchemes:
    Bearer Auth:
      type: http
      name: Bearer Auth
      scheme: bearer
      bearerFormat: JWT
